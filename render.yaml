# Render Blueprint for the Django backend.
# Deploy: push to GitHub, then "New > Blueprint" in Render and point it here.
services:
  - type: web
    name: truck-routing-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: HERE_API_KEY
        sync: false          # set in the Render dashboard (leave blank for demo mode)
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: PYTHON_VERSION
        value: "3.12.6"
